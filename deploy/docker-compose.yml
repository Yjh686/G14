# =============================================================================
# 校园问卷信息调查管理系统 —— 生产部署编排
#
# 三个容器：
#   mysql     数据存储，首次启动自动执行 deploy/sql/*.sql 建表与初始化
#   backend   Spring Boot 应用（java -jar），前端不直接访问它
#   frontend  Nginx：托管 Vue 静态产物 + 把 /api 反代到 backend
#
# 为什么前端容器同时承担反向代理：
#   浏览器只需要认一个地址。如果让浏览器直接打 backend 的 8080，
#   前端就要写死后端域名、还得配 CORS；现在同源，CORS 配置与
#   前端 baseURL 都能保持 /api 不变，开发和生产的差异只剩「谁在代理」。
#
# 启动：docker compose up -d --build
# 查看：docker compose ps / docker compose logs -f backend
# 停止：docker compose down          （加 -v 会连数据一起删）
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: g14-mysql
    restart: unless-stopped
    environment:
      # 没有 :- 默认值，缺了就启动失败并报清楚原因。
      # 一个写在开源仓库里的「默认密码」等于没有密码。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 里设置 MYSQL_ROOT_PASSWORD（参考 .env.example）}
      TZ: Asia/Shanghai
      # 必须有 LANG：官方 entrypoint 执行 initdb 脚本时调用的 mysql 客户端
      # 不带 --default-character-set，字符集取决于 locale。没有 LANG 时
      # 客户端默认 latin1，UTF-8 的中文 SQL 会被双重编码成乱码
      # （「校园问卷系统」→「æ ¡å›­é—®å·ç³»ç»Ÿ」），且会一路写进库里。
      # client-charset.cnf 是第二道保险，两者任一生效即可。
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      # 与开发环境保持一致：验收时的压测结论是在这两个参数下测出来的。
      # 想换取写入吞吐可以改成 2 与 0，但那会牺牲崩溃时最近 1 秒事务的持久性，
      # 属于拿正确性换性能，不能默认打开（详见 docs/test/压测报告.md 第 8 节）。
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    volumes:
      - mysql-data:/var/lib/mysql
      # 客户端字符集兜底配置（详见文件内注释）。容器没有 LANG 时
      # mysql 客户端会默认 latin1，把 UTF-8 建表脚本里的中文写成乱码。
      - ./mysql/client-charset.cnf:/etc/mysql/conf.d/client-charset.cnf:ro
      # 建表脚本按文件名顺序执行（01 → 02 → 03 → 04 → 05）。
      # 90_cleanup_test_data.sql 不在挂载范围内 —— 它是给开发期清测试数据用的，
      # 放进初始化目录会在每次全新部署时把演示数据一起删掉。
      - ./sql/01_schema_auth.sql:/docker-entrypoint-initdb.d/01_schema_auth.sql:ro
      - ./sql/02_schema_survey.sql:/docker-entrypoint-initdb.d/02_schema_survey.sql:ro
      - ./sql/03_schema_answer.sql:/docker-entrypoint-initdb.d/03_schema_answer.sql:ro
      - ./sql/04_schema_template.sql:/docker-entrypoint-initdb.d/04_schema_template.sql:ro
      - ./sql/05_schema_config.sql:/docker-entrypoint-initdb.d/05_schema_config.sql:ro
    ports:
      # 只映射到回环，避免把数据库直接暴露到公网。
      # 之所以做成变量：本机若已装 MySQL 占着 3306（开发机很常见），
      # 直接写死 3306 会让 compose 起不来，报 "port is already allocated"。
      # 生产机上没必要对外暴露 MySQL，可以整行删掉或用 127.0.0.1:13306:3306。
      - "${MYSQL_PUBLISH:-127.0.0.1:3306:3306}"
    healthcheck:
      # 用容器内的 MYSQL_PWD 读密码而不是拼进命令行：
      # 拼进命令行（-p$PASS）会让密码出现在进程列表里，同机其他用户能看见；
      # 而且 `#` 之类的字符在 shell 里会被当注释截断，导致健康检查莫名失败。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: g14-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # Spring Boot 的宽松绑定：环境变量会覆盖 application.yml 里的同名配置。
      # 库名带括号，JDBC URL 里必须转义成 %28 %29，否则驱动会把括号当语法。
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/G14%281%29?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
      SPRING_DATASOURCE_USERNAME: root
      # 用 DB_PASSWORD 而不是 SPRING_DATASOURCE_PASSWORD：
      # application.yml 里写的是 password: ${DB_PASSWORD}，两者虽然最终都能生效
      # （环境变量优先级高于 yml），但同名变量一眼能对上，排障时不用再想
      # 「这个 SPRING_DATASOURCE_PASSWORD 到底覆盖了什么」。
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 里设置 MYSQL_ROOT_PASSWORD}
      # 同样没有默认值：开源仓库里的默认 JWT 密钥等于所有部署共用一把钥匙，
      # 谁都能自己签一个 token 冒充管理员。缺了它后端会启动失败（JwtUtil 校验长度）。
      APP_JWT_SECRET: ${APP_JWT_SECRET:?请在 deploy/.env 里设置 APP_JWT_SECRET（至少 32 字节，可用 openssl rand -base64 48 生成）}
      # 注意这里没有 APP_SECURITY_DEFAULT_PASSWORD：
      # 默认密码与密码强度规则是 FR-CFG-02 的「可在线修改」项，真实来源是
      # sys_config 表（由 05_schema_config.sql 初始化），只能登录后在
      # 「系统配置」页改。再放一个环境变量只会造成「改了 compose 却不生效」。
      LOGGING_FILE_NAME: /app/logs/app.log
      # 堆大小跟着下面的 mem_limit 走：MaxRAMPercentage 取的是「容器可见内存」，
      # 没设 mem_limit 时它看到的是宿主机内存（比如 16G），堆会按 12G 去要，
      # 在只有 2G 的云主机上直接被 OOM Killer 干掉，而且报错信息里看不到原因。
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai}
    mem_limit: ${BACKEND_MEM:-1g}
    ports:
      # 同样只映射回环：外部一律走 frontend 的 80 端口，backend 不该被直接访问。
      # 这个映射纯粹是给运维排障用的（curl 127.0.0.1:8080/api/health 能绕过 nginx）。
      # 套了宿主机 HTTPS 反代时，把它改成 127.0.0.1:18080:8080 之类，
      # 避免和 frontend 抢端口时看不出来谁占了 8080。
      - "${BACKEND_PUBLISH:-127.0.0.1:8080:8080}"
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      # 用 wget 而不是 curl：eclipse-temurin 基础镜像不带 curl，装了又是几十 MB
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: g14-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # 默认 80:80，直接对外可访问。
      # 如果要在宿主机上再套一层 nginx 做 HTTPS（推荐做法，证书续期最省事），
      # 就把 FRONTEND_PUBLISH 写成 127.0.0.1:8080:80 —— 容器只听回环，
      # 公网 80/443 全部交给宿主机的 nginx 和 certbot。
      - "${FRONTEND_PUBLISH:-80:80}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  backend-logs:
