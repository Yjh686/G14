# =============================================================================
# 校园问卷系统 —— Nginx 主配置
#
# 这里只放与「整机行为」有关的设置，站点规则在 default.conf。
# =============================================================================

user  nginx;
# auto = 跟随容器可用的 CPU 核数
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------
    # access log 是「长期运行故障率」这项验收指标的第二份证据来源
    # （第一份是 24 小时长稳压测）。口径见 docs/requirements/验收标准.md 3.2：
    #   故障率 = 状态码 5xx 的行数 / 总行数
    # 所以这里必须记 $status，且不能被关闭。
    # ---------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 前端是 Vue 的 hash 路由产物，压缩收益很高（主 chunk 1.29MB → 419KB）
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml;

    # ---------------------------------------------------------------
    # 真实协议：区分「客户端连到最前面那一跳」用的是 http 还是 https
    #
    # 为什么需要 map：下面的 /api 反代原本写 proxy_set_header X-Forwarded-Proto $scheme，
    # 这个值永远是「nginx 这一跳自己的协议」——在容器里恒为 http。
    # 当前面还有一层终止 TLS（Cloudflare 隧道、云负载均衡、HTTPS 反代）时，
    # 后端收到的协议就是错的，进而算错自己的源，同源请求被当成跨域拒掉（403）。
    # 这里优先沿用上游已经给出的值，只有没有时才回落到 $scheme。
    # ---------------------------------------------------------------
    map $http_x_forwarded_proto $real_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # 上传体积：本系统只有登录/填写问卷的 JSON，没有文件上传。
    # 1MB 足够，且能挡掉意外的超大请求体。
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
