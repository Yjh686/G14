# =============================================================================
# 校园问卷系统 —— Nginx 主配置
#
# 这里只放与「整机行为」有关的设置，站点规则在 default.conf。
# =============================================================================

user  nginx;
# auto = 跟随容器可用的 CPU 核数
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------
    # access log 是「长期运行故障率」这项验收指标的第二份证据来源
    # （第一份是 24 小时长稳压测）。口径见 docs/requirements/验收标准.md 3.2：
    #   故障率 = 状态码 5xx 的行数 / 总行数
    # 所以这里必须记 $status，且不能被关闭。
    # ---------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 前端是 Vue 的 hash 路由产物，压缩收益很高（主 chunk 1.29MB → 419KB）
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml;

    # 上传体积：本系统只有登录/填写问卷的 JSON，没有文件上传。
    # 1MB 足够，且能挡掉意外的超大请求体。
    client_max_body_size 1m;

    include /etc/nginx/conf.d/*.conf;
}
