# =============================================================================
# 校园问卷系统 —— 站点配置
#
# 一个 server 同时干两件事：
#   1. 托管 Vue 的静态产物（history 路由需要 try_files 回落到 index.html）
#   2. 把 /api 反代到后端容器
#
# 之所以要同源：前端所有请求都写 /api 前缀，开发期由 Vite proxy 转发，
# 生产期由这里转发。同一份前端代码，两种环境都不需要改 baseURL，
# 也不需要后端开 CORS。
# =============================================================================

upstream campus_backend {
    # 容器名即主机名（docker compose 内置 DNS）
    server backend:8080;
    # 长连接复用：默认每个请求新建一条到后端的 TCP，
    # 高并发下会产生大量 TIME_WAIT；开启 keepalive 后复用固定数量的连接。
    keepalive 32;
}

server {
    # listen 80 默认只绑 IPv4。容器里 localhost 会优先解析到 ::1，
    # 于是任何访问 http://localhost/ 的健康检查都会拿到 Connection refused
    # ——服务其实是好的，但 docker 会一直报 unhealthy，运维看到容易误重启。
    # 显式同时监听 IPv6，且用 ipv6only=off 让同一个 socket 兼容两种情况。
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 下载类响应的文件名是后端用 RFC 5987 编码的，交给浏览器处理即可，
    # 这里不做任何 Content-Disposition 改写。

    # ---------------------------------------------------------------
    # 1. API 反向代理
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://campus_backend;
        # 后端靠这两个头识别真实客户端 IP（RequestUtil 优先取 X-Forwarded-For），
        # 不传的话日志里全员都是 172.x 的容器地址，登录日志失去排查价值。
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 用 $real_proto（见 nginx.conf 的 map），而不是 $scheme：
        # 前面有 Cloudflare 隧道 / 云负载均衡终止 TLS 时，$scheme 恒为 http，
        # 后端据此算出的「自己的源」是 http://域名，与浏览器的 https://域名 不符，
        # 同源 POST 会被 CORS 判为跨域并返回 403（页面能开、能加载资源，只有写操作失败）。
        proxy_set_header   X-Forwarded-Proto $real_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";

        # 导出 xlsx 是流式返回，几万行也要时间；默认 60s 可能不够
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 导出文件可达数 MB，关掉对下载响应的缓冲会反复写临时文件
        proxy_buffering    on;
        proxy_buffers      16 64k;
        proxy_busy_buffers_size 128k;
    }

    # ---------------------------------------------------------------
    # 2. 接口文档（生产环境刻意不对外）
    # ---------------------------------------------------------------
    # 后端开了 springdoc，但 Swagger UI 与 OpenAPI JSON 只监听容器内的 8080，
    # 没有经 nginx 暴露。这里显式返回 404 而不是让它落到下面的 try_files：
    # 若落到 try_files，/v3/api-docs 会返回 200 + index.html，
    # 浏览器里表现为「打开接口文档却看到首页」，看起来像同步出错，很难排查。
    #
    # 需要看接口文档时，在服务器上 curl 后端端口，或临时把 backend 端口
    # 映射到本机再访问 http://127.0.0.1:8080/swagger-ui.html。
    location /v3/ {
        return 404;
    }
    location /swagger-ui/ {
        return 404;
    }
    location = /swagger-ui.html {
        return 404;
    }

    # ---------------------------------------------------------------
    # 3. 静态资源
    # ---------------------------------------------------------------    # Vite 产物文件名带内容哈希（index-BoVHxOjJ.js），内容变了文件名就变，
    # 因此可以放心让浏览器缓存一年。反过来 index.html 绝不能缓存，
    # 否则用户会一直拿到旧的入口文件、指向已删除的旧 chunk。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Vue Router 使用 history 模式：/surveys/12/edit 这种路径在服务器上
    # 并没有对应文件，必须回落到 index.html 让前端路由接管，
    # 否则用户刷新页面就会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查给编排工具用，不写进 access log 免得刷屏
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
