# ============================================================
#  班级问卷系统 —— 应用配置
# ============================================================
server.port=8080
spring.application.name=G14

# ---------- 数据源（库名 G14，账号 root / 123456） ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 注意：characterEncoding 取 Java 字符集名（UTF-8），Connector/J 8 会自动映射为服务端 utf8mb4
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/G14?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=10

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.g14.g14.login.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.call-setters-on-nulls=true

# ---------- JSON ----------
spring.jackson.time-zone=Asia/Shanghai

# ---------- JWT ----------
# 生产环境请改为环境变量注入，长度必须 >= 32 字节（HS256 要求 256bit）
app.jwt.secret=G14-questionnaire-system-jwt-secret-key-2026-please-change-me
app.jwt.issuer=g14-questionnaire
# 令牌有效期（秒），默认 2 小时
app.jwt.expire-seconds=7200

# ---------- 认证策略 ----------
# 管理员开通账号 / 重置密码时，未显式指定密码则使用该初始密码。
# 该值本身在弱口令黑名单内，因此只走「长度校验」的宽松分支；
# 用户首次登录会被强制改密。前端 tools/seed-demo.mjs 依赖该配置项。
app.auth.initial-password=Init@1234
# 连续失败 N 次后锁定
app.login.max-fail=5
# 锁定分钟数
app.login.lock-minutes=15

# ---------- 引导管理员（首次启动自动创建） ----------
app.admin.init-account=admin
app.admin.init-password=Admin@123

# ---------- 日志 ----------
logging.level.com.g14.g14.login=info
